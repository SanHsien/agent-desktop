name: Fork Maintenance

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  hygiene:
    name: Fork Hygiene and Quality Gate
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Run Fork Hygiene Tests
        run: |
          python -m unittest discover -s tests/fork -v

      - name: Run Fork Developer Check
        shell: pwsh
        run: |
          pwsh -NoProfile -File tools/dev_check.ps1 -Full
